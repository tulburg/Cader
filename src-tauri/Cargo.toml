[package]
name = "cader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "Cader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", features = ["metal"] }
cpal = "0.18"
voice_activity_detector = "0.2.1"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
tauri-plugin-global-shortcut = "2"
ort = "=2.0.0-rc.10"
tokenizers = "0.22"
llama-cpp-2 = { version = "0.1.161", default-features = false, features = ["metal"] }
